# cargo-deny policy for the Rustume workspace.
#
# lintro runs `cargo deny --format json check` in the required Lintro Code
# Quality job. Before lintro 0.178.0 the wrapper passed `--format` after
# `check`, cargo-deny rejected the invocation and lintro reported it as a clean
# pass, so this repository never had a cargo-deny policy (lgtm-hq/py-lintro
# #3212). Every finding fails the job, warnings included.

[graph]
# An empty target list resolves every platform, including the wasm32 binding.
targets = []
all-features = false

[advisories]
# .osv-scanner.toml is the canonical exception record: it carries the expiry
# date and the reachability argument for every entry below, and OSV enforces
# the expiry on every full check. cargo-deny has no expiry field, so each entry
# here is a mirror and must be deleted in the same commit as its OSV twin
# (same rule as .cargo/audit.toml).
ignore = [
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust unmaintained via syntect 5.3.0 (latest); no fixed version. Mirror of .osv-scanner.toml (expires 2027-03-31)." },
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.x unmaintained via syntect 5.3.0 (latest); no fixed version. Mirror of .osv-scanner.toml (expires 2027-03-31)." },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained via hayagriva 0.10.1 / biblatex 0.12.0 (latest); no fixed version. Mirror of .osv-scanner.toml (expires 2026-12-31)." },
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38.4 via citationberg 0.7.0 (latest, pins ^0.38); no 0.38.x patch. Mirror of .osv-scanner.toml (expires 2026-12-30)." },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38.4 via citationberg 0.7.0 (latest, pins ^0.38); no 0.38.x patch. Mirror of .osv-scanner.toml (expires 2026-12-30)." },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser 0.25.1 unmaintained (latest) across the typst/resvg text stack; no fixed version. Mirror of .osv-scanner.toml (expires 2027-06-30)." },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz 0.20.1 unmaintained (latest) across the typst/resvg text stack; no fixed version. Mirror of .osv-scanner.toml (expires 2027-06-30)." },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained via serde_yaml 0.9.34+deprecated from typst-library 0.15.1 and hayagriva 0.10.1; no fixed version. Mirror of .osv-scanner.toml (expires 2026-12-31)." },
  { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.37.0 bundled SQLite CVE-2026-119375; fixed in 0.39.0 but sqlx-sqlite 0.9.0 (latest) caps <0.38. Mirror of .osv-scanner.toml (expires 2026-12-09)." },
]

[licenses]
# Every license below is compatible with distributing the workspace under
# AGPL-3.0-only. Dual-licensed crates pass when any one alternative is listed.
allow = [
  "0BSD",
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

[bans]
# The typst, resvg, sqlx and rand ecosystems pin different majors of shared
# crates (hashbrown, rand, getrandom, digest, quick-xml, windows-*), so the
# lockfile carries ~50 duplicate sets that no single bump in this repo can
# collapse. Record them as accepted rather than as per-crate skip entries.
multiple-versions = "allow"
# The only wildcard requirements are intra-workspace `path =` dependencies.
# `allow-wildcard-paths` would cover them only if every workspace crate set
# `publish = false`; none is published to crates.io, but none declares it yet
# either. Tighten to "deny" + allow-wildcard-paths once they do.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
