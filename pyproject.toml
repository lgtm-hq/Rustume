# Rustume Python Configuration
# This file exists primarily to enable lintro for cross-language linting.
# The main project is Rust + TypeScript.

[project]
name = "rustume-lint"
version = "0.1.0"
description = "Linting configuration for Rustume"
requires-python = ">=3.11"
readme = "README.md"
license = "AGPL-3.0-only"

# No Python dependencies - this is just for lintro tooling
dependencies = []

[dependency-groups]
# Exact pin, not a floor: an open `>=` range is always satisfied under
# Renovate's `replace` strategy, so it never proposes a bump and the local
# venv silently drifts behind the `lintro-image:` pin CI runs (#588).
lint = ["lintro==0.147.3"]
test = ["pytest>=8.3"]

[tool.lintro]
line_length = 100
tool_order = "priority"

[tool.lintro.post_checks]
enabled = false

[tool.pylint."messages control"]
# Policy opt-out of the lintro 0.147.x bundled pylint plugin: the first-party
# Python under apps/site/scripts and scripts/ci stays gated by ruff, bandit
# and mypy, and the vendored lgtm-ci tooling scripts are linted upstream in
# lgtm-ci's own repo, which owns the duplicate-code ratchet. Keep pylint
# silent here so consumers don't re-lint vendored code.
disable = ["all"]

[tool.bandit]
exclude_dirs = [".venv", "venv"]
# B101: assert in tests; B108: hardcoded /tmp in test fixtures only
skips = ["B101", "B108"]
