---
# Markdownlint configuration
# Line length set to match project standard (100 characters)
MD013:
  line_length: 100
  code_blocks: false
  tables: false

# Decision records repeat the same subheadings under every section on purpose —
# that parallel structure is what makes the sections comparable. Duplicates that
# share a parent heading are still flagged.
MD024:
  siblings_only: true
