---
name: Quality - Lint & Format
# Runs lintro quality analysis on PRs and pushes using Docker.

"on":
  push:
    branches: [main]
    paths:
      - "**.rs"
      - "**.md"
      - "**.yml"
      - "**.yaml"
      - "**.toml"
      - "**.sh"
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.mjs"
      - "**.astro"
      - "**.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile*"
      - ".github/workflows/**"
      - "scripts/**"
      - ".lintro-config.yaml"
      - ".lintro-ignore"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  # Give every main commit its own group: a shared group holds only one
  # pending run, and each new push evicts it regardless of
  # cancel-in-progress, so post-merge required checks were being lost.
  group: >-
    lint-${{ github.ref }}${{ github.ref == 'refs/heads/main'
    && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-quality-lint.yml@23c79b65490a3307fb08cdefafa22db12f75b9b2 # v0.63.1
    permissions:
      contents: read # checkout repository sources for lintro analysis
      packages: read # pull the pinned lintro image from GHCR
    with:
      tooling-ref: '23c79b65490a3307fb08cdefafa22db12f75b9b2' # v0.63.1
      job-name: "🛠️ Lintro Code Quality"
      lintro-tool-options: clippy:timeout=300
      timeout-minutes: 30
      runner-image: ubuntu-24.04
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro:0.113.2@sha256:5897de6bb3011324f92c1c5e62ad71ec63a4cd8c78cff67fb3f03476032a8480
      egress-policy: block
      egress-preset: quality

  publish-pr-comment:
    needs: quality
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-quality-summary.yml@23c79b65490a3307fb08cdefafa22db12f75b9b2 # v0.63.1
    permissions:
      contents: read # read quality job outputs and artifacts
      pull-requests: write # post or update the quality summary comment
    with:
      exit-code: >-
        ${{ needs.quality.outputs.exit-code != '' && needs.quality.outputs.exit-code || '1' }}
      tooling-ref: '23c79b65490a3307fb08cdefafa22db12f75b9b2' # v0.63.1
      job-name: "🛠️ Lintro Code Quality PR Comment"
      runner-image: ubuntu-24.04
      egress-policy: block
