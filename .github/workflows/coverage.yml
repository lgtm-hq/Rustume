---
name: Coverage Reports

"on":
  push:
    branches: [main]
    paths:
      - "**.rs"
      - "**.ts"
      - "**.tsx"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/fixtures/**"
      - "apps/web/**"
      - ".github/workflows/coverage.yml"
      - "scripts/ci/testing/**"
  pull_request:
    branches: [main]
    # `ready_for_review` is not a default activity type: without it a PR
    # opened as a draft and later marked ready never gets the required
    # rust-coverage / web-coverage checks, forcing a close/reopen (#801
    # fixed `quality` the same way).
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; never cancel main (post-merge coverage must
# complete so Pages coverage publishing and required gates stay reliable).
concurrency:
  # Give every main commit its own group: a shared group holds only one
  # pending run, and each new push evicts it regardless of
  # cancel-in-progress, so post-merge required checks were being lost.
  group: >-
    coverage-${{ github.ref }}${{ github.ref == 'refs/heads/main'
    && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # No standalone DB-integration job (#456): the rust-coverage job's
  # setup-script (setup-postgres-test-db.sh) provisions Postgres, applies
  # migrations, and exports TEST_DATABASE_URL before `cargo llvm-cov nextest
  # --workspace` runs, so the server DB integration tests execute there —
  # instrumented, as a superset of the old dedicated job's filter.
  rust-coverage:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-rust-test.yml@23c79b65490a3307fb08cdefafa22db12f75b9b2 # v0.63.1
    permissions:
      contents: read
      pull-requests: write # publish-test-summary on PRs
    with:
      tooling-ref: '23c79b65490a3307fb08cdefafa22db12f75b9b2' # v0.63.1
      job-name: "🦀 Rust Coverage"
      coverage: true
      setup-script: scripts/ci/testing/rust/setup-postgres-test-db.sh
      upload-pages-coverage-html: true
      pages-coverage-artifact-name: rust-coverage-html
      comment-marker: rust-coverage-report
      publish-test-summary: true
      runner-image: ubuntu-24.04
      timeout-minutes: 45

  web-coverage:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-node.yml@23c79b65490a3307fb08cdefafa22db12f75b9b2 # v0.63.1
    permissions:
      contents: read
      pull-requests: write # publish-test-summary on PRs
    with:
      tooling-ref: '23c79b65490a3307fb08cdefafa22db12f75b9b2' # v0.63.1
      job-name: "🌐 Web Coverage"
      node-version: "22"
      working-directory: apps/web
      package-manager: bun
      pre-test-command: bun run typecheck && bun run lint
      coverage: true
      coverage-format: html
      comment-marker: web-coverage-report
      coverage-summary-file: coverage/coverage-summary.json
      upload-coverage: true
      upload-pages-coverage-html: true
      pages-coverage-artifact-name: web-coverage-html
      pages-coverage-source-subpath: coverage
      # TODO(lgtm-hq/lgtm-ci#511): revert to true once reusable-test-node's
      # "Stage coverage for test summary" step sets the COVERAGE env var. At
      # v0.52.3 the step hard-fails for single-version coverage callers on
      # PRs, taking the required 🌐 Web Coverage check down with it.
      publish-test-summary: false
      runner-image: ubuntu-24.04
      timeout-minutes: 30
