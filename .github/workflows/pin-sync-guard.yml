# SPDX-License-Identifier: AGPL-3.0-only
---
name: Quality - Pin Sync Guard
# Fails when a workflow's `tooling-ref:` input drifts from the lgtm-ci `uses:`
# pin it mirrors, or when non-ai-review workflows disagree on the lgtm-ci
# release. ai-review.yml may pin a newer reusable than the shared repo pin.

"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/maintenance/check-tooling-ref-sync.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/maintenance/check-tooling-ref-sync.sh'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-sync-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pin-sync:
    name: lgtm-ci pin sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/secure-checkout@396e1e28f14d371761558178e75be9c56cc994cf # v0.63.6
        with:
          persist-credentials: false

      - name: Pin sync guard
        run: bash scripts/ci/maintenance/check-tooling-ref-sync.sh
