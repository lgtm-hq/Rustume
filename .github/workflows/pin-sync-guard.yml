# SPDX-License-Identifier: AGPL-3.0-only
---
name: Quality - Pin Sync Guard
# Fails when a workflow's `tooling-ref:` input drifts from the lgtm-ci `uses:`
# pin it mirrors, or when the workflows disagree on the lgtm-ci release.

"on":
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/maintenance/check-tooling-ref-sync.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/maintenance/check-tooling-ref-sync.sh'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pin-sync-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-sync:
    name: lgtm-ci pin sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/secure-checkout@240daf3ed1f7475b3f322502035b15994be210a8 # v0.59.16
        with:
          persist-credentials: false

      - name: Pin sync guard
        run: bash scripts/ci/maintenance/check-tooling-ref-sync.sh
