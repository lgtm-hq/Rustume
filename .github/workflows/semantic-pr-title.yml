# SPDX-License-Identifier: AGPL-3.0-only
---
name: PR - Title Validation
# Validates PR titles follow Conventional Commits format.

"on":
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions: {}

concurrency:
  group: semantic-pr-title-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-title:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-semantic-pr-title.yml@d32388495d571a0ee13383bacc732765bf4e9e7d # v0.74.6
    with:
      job-name: "📝 Validate PR Title"
      tooling-ref: 'd32388495d571a0ee13383bacc732765bf4e9e7d' # v0.74.6
      egress-policy: block
      egress-preset: github-tooling
      comment-marker: "<!-- semantic-pr-title -->"
    permissions:
      contents: read
      pull-requests: write
