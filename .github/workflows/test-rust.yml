---
name: Rust Build (workspace)
# Compiles the Rust workspace on PRs and pushes to main.
# Rust tests execute once via cargo llvm-cov in the Coverage Reports workflow.

"on":
  push:
    branches: [main]
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/fixtures/**"
      - ".github/workflows/test-rust.yml"
  pull_request:
    branches: [main]
    # `ready_for_review` is not a default activity type: without it a PR
    # opened as a draft and later marked ready never gets this required
    # check, forcing a close/reopen (#801 fixed `quality` the same way).
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  # Give every main commit its own group: a shared group holds only one
  # pending run, and each new push evicts it regardless of
  # cancel-in-progress, so post-merge required checks were being lost.
  group: >-
    build-${{ github.ref }}${{ github.ref == 'refs/heads/main'
    && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust-build:
    # Call reusable-test-rust-build directly (not reusable-rust-build) so the
    # ruleset check name stays rust-build / 🔨 Build Check — an extra nesting
    # hop would prefix build / and break required-status matching.
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-rust-build.yml@396e1e28f14d371761558178e75be9c56cc994cf # v0.63.6
    with:
      job-name: "🔨 Build Check"
      tooling-ref: '396e1e28f14d371761558178e75be9c56cc994cf' # v0.63.6
      draft-pr-skip: true
      egress-policy: block
      egress-preset: quality
      runner-image: ubuntu-24.04
      timeout-minutes: 30
    permissions:
      contents: read
