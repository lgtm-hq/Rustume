# SPDX-License-Identifier: AGPL-3.0-only
---
name: Test - Boundary Shell Scripts

"on":
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/boundary/**'
      - 'tests/bats/**'
      - '.github/workflows/test-boundary-shell.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/boundary/**'
      - 'tests/bats/**'
      - '.github/workflows/test-boundary-shell.yml'

permissions:
  contents: read

concurrency:
  group: test-boundary-shell-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shell-tests:
    permissions:
      contents: read
      pull-requests: write # publish-test-summary posts shell coverage on PRs
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-shell.yml@23c79b65490a3307fb08cdefafa22db12f75b9b2 # v0.63.1
    with:
      tooling-ref: '23c79b65490a3307fb08cdefafa22db12f75b9b2' # v0.63.1
      job-name: Boundary Shell Tests
      test-path: tests/bats/unit/boundary
      coverage: true
      coverage-threshold: 0
      upload-coverage: false
      egress-policy: block
      egress-preset: github-tooling
      runner-image: ubuntu-24.04
