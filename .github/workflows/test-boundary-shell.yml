# SPDX-License-Identifier: AGPL-3.0-only
---
name: Test - Boundary Shell Scripts

"on":
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/boundary/**'
      - 'tests/bats/**'
      - '.github/workflows/test-boundary-shell.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/boundary/**'
      - 'tests/bats/**'
      - '.github/workflows/test-boundary-shell.yml'

permissions:
  contents: read

concurrency:
  group: test-boundary-shell-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shell-tests:
    permissions:
      actions: read # lgtm-ci v0.76+: aggregate job reads the run's artifact listing
      contents: read
      pull-requests: write # publish-test-summary posts shell coverage on PRs
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-shell.yml@2097a900753e3e5ad0e336483501b278e99855ae # v0.78.1
    with:
      tooling-ref: '2097a900753e3e5ad0e336483501b278e99855ae' # v0.78.1
      job-name: Boundary Shell Tests
      test-path: tests/bats/unit/boundary
      coverage: true
      coverage-threshold: 0
      upload-coverage: false
      egress-policy: audit # TEMP: lgtm-hq/lgtm-ci#1207
      egress-preset: shell-test
      runner-image: ubuntu-24.04
