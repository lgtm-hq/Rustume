# SPDX-License-Identifier: AGPL-3.0-only
---
name: Test - Web E2E
# Playwright suites for the web app (apps/web/e2e) — smoke, per-flow E2E
# (CRUD, templates, export, import, offline), visual regression, and
# accessibility — via lgtm-ci's reusable-test-e2e-playwright. The reusable owns
# bun install, the Chromium download/cache, the report artifact, and the PR
# summary comment; it knows nothing about Rust, so the wasm32 target,
# wasm-pack, the WASM build, and the production bundle are done by the
# test-command script below.
#
# One call, not one per suite: every suite needs that same WASM + bundle build,
# and sibling calls are separate jobs that cannot share it, so splitting would
# rebuild the WASM module per suite for no extra signal. playwright.config.ts
# already isolates visual regression in its own project so it can opt out of
# retries.
#
# Visual baselines live in apps/web/e2e/__screenshots__ and are generated on
# this runner (Linux) — on baseline changes, download the Playwright report
# artifact and commit the updated screenshots from it (same flow for the
# chrome surfaces in visual.spec.ts and the per-template sheet set in
# template-sheet.visual.spec.ts; see crates/render/tests/baselines/README.md).
#
# PDF/Typst baselines for the same fixture live under
# crates/render/tests/baselines/pdf/ and are gated by cargo test, not this job.

"on":
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'bindings/wasm/**'
      - 'crates/schema/**'
      - 'crates/parser/**'
      - 'crates/storage/**'
      - 'crates/utils/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/ci/testing/web/**'
      - '.github/workflows/test-e2e-web.yml'
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Give every main commit its own group: a shared group holds only one
  # pending run, and each new push evicts it regardless of
  # cancel-in-progress, so post-merge required checks were being lost.
  group: >-
    test-e2e-web-${{ github.ref }}${{ github.ref == 'refs/heads/main'
    && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web-e2e:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-e2e-playwright.yml@23c79b65490a3307fb08cdefafa22db12f75b9b2 # v0.63.1
    permissions:
      contents: read
      pull-requests: write # publish-test-summary on PRs
    with:
      tooling-ref: '23c79b65490a3307fb08cdefafa22db12f75b9b2' # v0.63.1
      job-name: "🎭 Web E2E"
      node-version: "22"
      working-directory: apps/web
      package-manager: bun
      browsers: chromium
      # playwright.config.ts already resolves to chromium-only under CI, so no
      # --project filter is passed.
      test-command: bash ../../scripts/ci/testing/web/e2e.sh
      upload-report: true
      publish-test-summary: true
      comment-marker: web-e2e-report
      draft-pr-skip: true
      egress-policy: block
      # The reusable's harden-runner step consumes `allowed-endpoints`
      # verbatim, so `egress-preset: playwright` cannot be extended via
      # `allowed-endpoints-mode: append` here — the full list is spelled out
      # instead. It is the lgtm-ci `playwright` preset (cdn.playwright.dev and
      # friends included) plus what the Rust/WASM build stage needs.
      allowed-endpoints: >-
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        release-assets.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        results-receiver.actions.githubusercontent.com:443
        *.blob.core.windows.net:443
        registry.npmjs.org:443
        nodejs.org:443
        bun.sh:443
        cdn.playwright.dev:443
        playwright.azureedge.net:443
        playwright-akamai.azureedge.net:443
        playwright-verizon.azureedge.net:443
        playwright.download.prss.microsoft.com:443
        storage.googleapis.com:443
        archive.ubuntu.com:80
        security.ubuntu.com:80
        azure.archive.ubuntu.com:80
        esm.ubuntu.com:443
        packages.microsoft.com:443
        static.rust-lang.org:443
        crates.io:443
        index.crates.io:443
        static.crates.io:443
      runner-image: ubuntu-24.04
      timeout-minutes: 30
