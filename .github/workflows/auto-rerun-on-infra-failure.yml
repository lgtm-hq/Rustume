# SPDX-License-Identifier: AGPL-3.0-only
---
name: Auto Rerun on Infra Failure

# When a listed workflow fails and its failed-job logs match a known
# GitHub-side outage signature ("Failed to resolve action download info",
# runner shutdown signals, harden-runner allowed-domain resolution errors),
# re-run only the failed jobs — once (run-attempt guard upstream). Closes the
# loop on incidents like 2026-07-13 (runs 29252857248, 29252725585,
# 29261557105) where pure infra failures needed manual reruns. See #463.
#
# workflow_run triggers only run from the definition on the default branch, so
# changes here take effect after merging to main. Do not use
# workflow_run.branches: tag-push runs expose the tag as head_branch and would
# be filtered before this job can inspect/rerun matching infra failures.

"on":
  workflow_run:
    workflows:
      - Build - Docker Image & Registry
      - Coverage Reports
      - Deploy - GitHub Pages
      - Rust Build (workspace)
      - Quality - Lint & Format
      # Release gate. verify-image idles on a runner for up to 8100s polling
      # GHCR for docker-build-publish's tags, which makes it the job most
      # exposed to runner reclamation — and the only one whose loss withholds
      # a published GitHub Release. v0.50.1 hit exactly that (run 30289961951
      # attempt 1, exit 143 at 680s of budget) and needed a manual rerun. #639
      - Publish - GitHub Release
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' ||
      startsWith(github.event.workflow_run.head_branch, 'v'))
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-auto-rerun-on-infra-failure.yml@23c79b65490a3307fb08cdefafa22db12f75b9b2 # v0.63.1
    permissions:
      actions: write
      contents: read
    with:
      tooling-ref: '23c79b65490a3307fb08cdefafa22db12f75b9b2' # v0.63.1
      # run id/attempt are numbers in the event payload; format() passes them
      # as the strings the reusable workflow inputs expect.
      run-id: ${{ format('{0}', github.event.workflow_run.id) }}
      run-attempt: ${{ format('{0}', github.event.workflow_run.run_attempt) }}
      egress-policy: block
      egress-preset: github-minimal
