# SPDX-License-Identifier: AGPL-3.0-only
---
name: Security - Dependency Vulnerability Scan

"on":
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    # Weekly scan: Monday 05:30 UTC
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  # Give every main commit its own group: a shared group holds only one
  # pending run, and each new push evicts it regardless of
  # cancel-in-progress, so post-merge required checks were being lost.
  group: >-
    security-audit-${{ github.ref }}${{ github.ref == 'refs/heads/main'
    && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security-audit:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-security-audit.yml@240daf3ed1f7475b3f322502035b15994be210a8 # v0.59.16
    permissions:
      contents: read
      packages: read
    with:
      tooling-ref: '240daf3ed1f7475b3f322502035b15994be210a8' # v0.59.16
      job-name: "Scan dependencies"
      runner-image: ubuntu-24.04
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro:0.112.5@sha256:a06c74481eca897cad58c4df4c07f2f4556063db3cbf097ac0b526aaaa27c0eb
      upload-comment-artifact: ${{ github.event_name == 'pull_request' }}
      egress-policy: block
      egress-preset: quality

  security-audit-required:
    name: "🔐 Security Audit"
    needs: security-audit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # Direct step-security invocation: lgtm-ci removed its harden-runner
        # composite in v0.50.0 (the action pre hook must install the agent,
        # so allowed-endpoints must be a literal — github-tooling preset).
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            pipelines.actions.githubusercontent.com:443

      - name: Checkout lgtm-ci tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lgtm-hq/lgtm-ci
          path: .lgtm-ci-tooling
          ref: '240daf3ed1f7475b3f322502035b15994be210a8' # v0.59.16
          sparse-checkout: |
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Assert required check
        env:
          UPSTREAM_RESULT: ${{ needs.security-audit.result }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/assert-required-check.sh

  post-pr-comment:
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: security-audit
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-security-audit-comment.yml@240daf3ed1f7475b3f322502035b15994be210a8 # v0.59.16
    permissions:
      contents: read
      pull-requests: write
    with:
      tooling-ref: '240daf3ed1f7475b3f322502035b15994be210a8' # v0.59.16
      job-name: "💬 Post PR Comment"
      runner-image: ubuntu-24.04
      egress-policy: block
