# SPDX-License-Identifier: AGPL-3.0-only
---
name: Security - Dependency Vulnerability Scan

"on":
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    # Weekly scan: Monday 05:30 UTC
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  # Give every main commit its own group: a shared group holds only one
  # pending run, and each new push evicts it regardless of
  # cancel-in-progress, so post-merge required checks were being lost.
  group: >-
    security-audit-${{ github.ref }}${{ github.ref == 'refs/heads/main'
    && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security-audit:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-security-audit.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    permissions:
      contents: read
      packages: read # pull the pinned lintro audit image from GHCR
    with:
      tooling-ref: "b830ca6972f0c9cbaeb1363283de594f68d66acf" # v0.87.0
      job-name: "Scan dependencies"
      # yamllint disable-line rule:line-length
      lintro-image: ghcr.io/lgtm-hq/py-lintro:0.180.9@sha256:5ec38eb12f081b875a9b65044d93eb129b6731fdc05bb98c502027ac4a5e4703
      upload-comment-artifact: ${{ github.event_name == 'pull_request' }}
      egress-policy: block
      egress-preset: quality

  security-audit-required:
    name: "🔐 Security Audit"
    needs: security-audit
    if: always()
    runs-on: ${{ vars.LGTM_CI_RUNNER || 'ubuntu-26.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        # Direct step-security invocation: lgtm-ci removed its harden-runner
        # composite in v0.50.0 (the action pre hook must install the agent,
        # so allowed-endpoints must be a literal — github-tooling preset).
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            uploads.github.com:443
            pipelines.actions.githubusercontent.com:443

      - name: Checkout lgtm-ci tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lgtm-hq/lgtm-ci
          path: .lgtm-ci-tooling
          ref: "b830ca6972f0c9cbaeb1363283de594f68d66acf" # v0.87.0
          sparse-checkout: |
            scripts/ci/
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Assert required check
        env:
          UPSTREAM_RESULT: ${{ needs.security-audit.result }}
        run: bash .lgtm-ci-tooling/scripts/ci/actions/assert-required-check.sh

  post-pr-comment:
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: security-audit
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-publish-security-audit-comment.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    permissions:
      contents: read
      pull-requests: write # publish the audit summary on this PR
    with:
      tooling-ref: "b830ca6972f0c9cbaeb1363283de594f68d66acf" # v0.87.0
      job-name: "💬 Post PR Comment"
      egress-policy: block
