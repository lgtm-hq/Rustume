# SPDX-License-Identifier: AGPL-3.0-only
---
name: Test - Release Shell Scripts

"on":
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/release/**'
      - 'tests/bats/**'
      - '.github/workflows/test-release-shell.yml'
      - '.github/workflows/reconcile-releases.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci/release/**'
      - 'tests/bats/**'
      - '.github/workflows/test-release-shell.yml'
      - '.github/workflows/reconcile-releases.yml'

permissions:
  contents: read

concurrency:
  group: test-release-shell-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shell-tests:
    permissions:
      actions: read # lgtm-ci v0.76+: aggregate job reads the run's artifact listing
      contents: read
      pull-requests: write # publish-test-summary posts shell coverage on PRs
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-shell.yml@9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb # v0.78.0
    with:
      tooling-ref: '9ea778eb4e6b876d60b7b3d7d0d0aee5182717bb' # v0.78.0
      job-name: Release Shell Tests
      test-path: tests/bats/unit/release
      coverage: true
      coverage-threshold: 0
      upload-coverage: false
      egress-policy: block
      egress-preset: shell-test
      runner-image: ubuntu-24.04
