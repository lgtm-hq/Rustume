# SPDX-License-Identifier: AGPL-3.0-only
---
name: Build - Docker Image & Registry
# Builds and publishes Docker images to GHCR via lgtm-ci reusable-docker.
# - PRs: native multi-arch validation (build + smoke + blocking scan, no push)
# - main/tags: publish, cosign sign, SBOM, provenance, registry cache
#   (no `release:` trigger: publish-release-on-tag.yml creates the GitHub
#   Release from the tag, so a release trigger would rebuild the identical
#   image a second time — see #454. Tag pushes always fire: GitHub does not
#   evaluate `paths` filters for tag pushes.)
#
# Path filtering (#476): required-check-safe deny-by-default. There is no
# on.<event>.paths allow-list (those rot when new top-level dirs appear).
# Instead the `classify` job resolves pipeline=false only when EVERY changed
# file matches the skip-list (markdown / docs/**); anything else — including
# brand-new directories — runs Docker. Classification failures fail open.
# Release bump-only merges still skip via classify_release_bump.sh (#457).
#
# Rustume Cloud deploy tags (reusable-docker metadata-action):
#   main push  -> ghcr.io/lgtm-hq/rustume:main, :sha-<commit>
#   v*.*.* tag -> ghcr.io/lgtm-hq/rustume:<semver>, :latest, :sha-<commit>
# Staging should track :main (or digest-pin sha-<commit> from the same build).
# Production should track release semver tags (prefer digest-pinned sha-<commit>).
# This repo's responsibility ends at the GHCR publish; hosted deploys run from
# the private rustume-ops repo (deploy runbook lives there).

"on":
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR validate runs; never cancel main/tag/release publishes
# (a cancelled publish would leave GHCR tags and signatures in a partial
# state, and downstream rustume-ops deploys pull these tags).
concurrency:
  # Give every main commit its own group: a shared group holds only one
  # pending run, and each new push evicts it regardless of
  # cancel-in-progress, so post-merge required checks were being lost.
  group: >-
    docker-${{ github.ref }}${{ github.ref == 'refs/heads/main'
    && format('-{0}', github.sha) || '' }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' }}

jobs:
  # Path relevance (#476) + release bump-only (#457). Always runs so required
  # docker contexts are never absent. Downstream compares != 'false' /
  # != 'true' with always() so a failed classify job fails open (runs docker).
  classify:
    name: 🔎 Classify Docker Relevance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      pipeline: ${{ steps.paths.outputs.pipeline }}
      bump-only: ${{ steps.bump.outputs.bump-only }}
      skip-reason: ${{ steps.paths.outputs.skip-reason }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify path relevance
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci/docker/resolve_docker_relevance.sh
      - name: Classify release bump
        id: bump
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && startsWith(github.event.head_commit.message, 'chore(release): version')
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/ci/docker/classify_release_bump.sh

  docker:
    name: 🐳 Docker Build & Publish
    needs: classify
    if: >-
      always()
      && needs.classify.outputs.pipeline != 'false'
      && needs.classify.outputs.bump-only != 'true'
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-docker.yml@396e1e28f14d371761558178e75be9c56cc994cf # v0.63.6
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      tooling-ref: '396e1e28f14d371761558178e75be9c56cc994cf' # v0.63.6
      file: docker/Dockerfile
      image-name: lgtm-hq/rustume
      version: >-
        ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      push: >-
        ${{ github.event_name != 'pull_request'
        && (github.ref == 'refs/heads/main'
        || startsWith(github.ref, 'refs/tags/v')) }}
      validate-on-pr: ${{ github.event_name == 'pull_request' }}
      platforms: linux/amd64,linux/arm64
      runner-map: '{"linux/arm64":"ubuntu-24.04-arm"}'
      # The amd64 hosted image carries large SDK/toolcache trees that this
      # Docker-only job does not use. Reclaim them before BuildKit starts and
      # sample memory/disk usage so any remaining runner loss is attributable.
      free-disk-space: true
      resource-monitor: true
      smoke-test-script: scripts/ci/docker/smoke-test.sh
      # Stamps the running build's commit into `GET /version` (#584) so a deploy
      # can be verified against the `sha-<commit>` tag rustume-ops pins in
      # deploy/image.txt. docker/Dockerfile truncates it to the same 7 chars
      # metadata-action uses for that tag.
      build-args: |
        GIT_COMMIT=${{ github.sha }}
      # Cold amd64 builds (no registry cache hit) exceed the 60-minute
      # default: the workspace cargo build alone runs ~50 minutes (#439).
      timeout-minutes: 120
      scan: true
      scan-exit-code: "1"
      cosign-sign: true
      cache-registry-ref: ghcr.io/lgtm-hq/rustume:cache
      no-cache: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # SBOM/provenance attestations produce manifest lists incompatible with
      # --load used during PR validation (validate-on-pr + scan).
      provenance: ${{ github.event_name != 'pull_request' }}
      sbom: ${{ github.event_name != 'pull_request' }}
      # Harden-runner pre reads workflow inputs only (not resolved presets).
      # Full list = reusable-docker default + gcr.io (distroless base image
      # in docker/Dockerfile) + sigstore hosts (cosign-sign on push runs) +
      # trivy hosts (installer downloads from get.trivy.dev; vulnerability DB
      # is pulled from ghcr.io with mirror.gcr.io / public.ecr.aws fallbacks) +
      # dl-cdn.alpinelinux.org (apk package installs in docker/Dockerfile
      # build stages run through the host egress proxy under harden-runner) +
      # rust hosts (rustup target add wasm32 pulls from static.rust-lang.org;
      # cargo chef cook fetches the crates index / .crate files;
      # pinned cargo-binstall, cargo-chef, wasm-pack, and wasm-bindgen-cli
      # assets come from GitHub releases) +
      # registry.npmjs.org (bun install in the web-builder stage downloads
      # packages from the npm registry on cache-cold builds).
      allowed-endpoints-mode: replace
      allowed-endpoints: >
        github.com:443
        api.github.com:443
        codeload.github.com:443
        objects.githubusercontent.com:443
        raw.githubusercontent.com:443
        release-assets.githubusercontent.com:443
        github-releases.githubusercontent.com:443
        pipelines.actions.githubusercontent.com:443
        ghcr.io:443
        pkg-containers.githubusercontent.com:443
        docker.io:443
        registry-1.docker.io:443
        auth.docker.io:443
        production.cloudflare.docker.com:443
        production.cloudfront.docker.com:443
        gcr.io:443
        fulcio.sigstore.dev:443
        rekor.sigstore.dev:443
        tuf-repo-cdn.sigstore.dev:443
        timestamp.sigstore.dev:443
        get.trivy.dev:443
        mirror.gcr.io:443
        public.ecr.aws:443
        dl-cdn.alpinelinux.org:443
        static.rust-lang.org:443
        crates.io:443
        index.crates.io:443
        static.crates.io:443
        registry.npmjs.org:443

  # Publish verification (#597). `Merge Manifests` inside reusable-docker runs
  # only after EVERY platform succeeds, so one dead runner ("The runner has
  # received a shutdown signal") skips the merge and publishes NO tags — while
  # the git tag and GitHub Release may already exist. This job asserts the
  # contracted tags actually resolve, so the run reads as "the release did not
  # ship" instead of "one flaky platform".
  #
  # `always()` on purpose: when the build fails this job must still run and go
  # red with an attributable message, not skip. It is required on tag builds
  # and scoped to :main + :sha- on main builds. It never runs on PRs (nothing
  # is pushed) and skips exactly when the docker job itself is skipped.
  verify-images:
    name: 🔍 Verify Published Tags
    needs: [classify, docker]
    if: >-
      always()
      && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/v'))
      && needs.classify.outputs.pipeline != 'false'
      && needs.classify.outputs.bump-only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443

      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/secure-checkout@396e1e28f14d371761558178e75be9c56cc994cf # v0.63.6

      - name: Verify published tags resolve
        env:
          IMAGE_REF: ghcr.io/lgtm-hq/rustume
          EXPECT_PLATFORMS: linux/amd64,linux/arm64
          # The manifest merge has already run; retry only long enough to
          # absorb GHCR read-after-write lag.
          TIMEOUT_SECONDS: "120"
          POLL_INTERVAL_SECONDS: "15"
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/docker/verify-published-tags.sh
