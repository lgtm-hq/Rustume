# SPDX-License-Identifier: AGPL-3.0-only
---
name: Publish - GitHub Release
# Creates GitHub Release when version tags are pushed.
# Validates tag matches Cargo.toml, builds cross-platform binaries,
# and uses lgtm-ci actions for release creation.

"on":
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-tag:
    name: ✅ Verify Tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Harden Runner
        # Direct step-security invocation: lgtm-ci removed its harden-runner
        # composite in v0.50.0 (the action pre hook must install the agent).
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443

      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/secure-checkout@240daf3ed1f7475b3f322502035b15994be210a8 # v0.59.16
        with:
          fetch-depth: 0

      - name: Read version from Cargo.toml
        id: version
        run: ./scripts/ci/maintenance/auto-tag.sh read-version

      - name: Verify tag matches Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
          CARGO_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/ci/release/verify-tag-version.sh

  build-binaries:
    name: 🔨 Build Binaries
    needs: verify-tag
    uses: ./.github/workflows/build-binary.yml
    permissions:
      contents: read

  # Release gate (#597). docker-build-publish.yml runs as a separate workflow
  # on the same tag push, so this job waits for the container tags it is
  # contracted to publish and fails if they never appear. `release` needs it,
  # which is what keeps a GitHub Release from existing without its image.
  #
  # The wait budget covers the docker job's own timeout-minutes: 120 plus
  # queueing. WATCH_WORKFLOW short-circuits the wait when that workflow has
  # already concluded without success, so a dead runner fails in minutes
  # rather than burning the full budget.
  verify-image:
    name: 🔍 Verify Release Image
    needs: verify-tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      actions: read # WATCH_WORKFLOW reads docker-build-publish run status
    timeout-minutes: 150

    steps:
      - name: Harden Runner
        # Direct step-security invocation: lgtm-ci removed its harden-runner
        # composite in v0.50.0 (the action pre hook must install the agent).
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443

      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/secure-checkout@240daf3ed1f7475b3f322502035b15994be210a8 # v0.59.16

      - name: Wait for the release image to be published
        env:
          IMAGE_REF: ghcr.io/lgtm-hq/rustume
          EXPECT_PLATFORMS: linux/amd64,linux/arm64
          TIMEOUT_SECONDS: "8100"
          POLL_INTERVAL_SECONDS: "30"
          WATCH_WORKFLOW: docker-build-publish.yml
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/docker/verify-published-tags.sh

  release:
    name: 📦 Create GitHub Release
    needs: [verify-tag, build-binaries, verify-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        # Direct step-security invocation: lgtm-ci removed its harden-runner
        # composite in v0.50.0 (the action pre hook must install the agent).
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            pipelines.actions.githubusercontent.com:443

      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/secure-checkout@240daf3ed1f7475b3f322502035b15994be210a8 # v0.59.16

      - name: Download all artifacts
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub App installation token
        id: app-token
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Create GitHub Release
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/create-github-release@240daf3ed1f7475b3f322502035b15994be210a8 # v0.59.16
        with:
          tag: ${{ github.ref_name }}
          generate-notes: "true"
          files: artifacts/*
          # App token so release:published can trigger downstream workflows
          token: ${{ steps.app-token.outputs.token }}
