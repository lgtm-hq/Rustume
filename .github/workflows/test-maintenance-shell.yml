# SPDX-License-Identifier: AGPL-3.0-only
---
name: Test - Maintenance Shell Scripts

"on":
  pull_request:
    branches: [main]
    paths:
      - "scripts/ci/maintenance/**"
      - "tests/bats/**"
      - ".github/workflows/test-maintenance-shell.yml"
  push:
    branches: [main]
    paths:
      - "scripts/ci/maintenance/**"
      - "tests/bats/**"
      - ".github/workflows/test-maintenance-shell.yml"

permissions:
  contents: read

concurrency:
  group: test-maintenance-shell-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shell-tests:
    permissions:
      actions: read # lgtm-ci v0.76+: aggregate job reads the run's artifact listing
      contents: read
      pull-requests: write # publish-test-summary posts shell coverage on PRs
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-test-shell.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    with:
      tooling-ref: "b830ca6972f0c9cbaeb1363283de594f68d66acf" # v0.87.0
      job-name: Maintenance Shell Tests
      test-path: tests/bats/unit/maintenance
      coverage: true
      # kcov reports 0% for bash via BATS; non-zero fails CI until measurement fixed
      coverage-threshold: 0
      upload-coverage: false
      egress-policy: block
      egress-preset: shell-test
