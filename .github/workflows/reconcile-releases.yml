# SPDX-License-Identifier: AGPL-3.0-only
---
name: Reconcile - GitHub Releases
# Loud check that every recent v* tag still has a GitHub Release and a GHCR
# image. Catches the silent-skip class of #698 after the fact.

"on":
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}
  # Tag push is deliberately omitted: reconcile is after-the-fact. Firing
  # on `v*.*.*` races the publish workflows and fails while artifacts are
  # still being written.

permissions: {}

concurrency:
  group: reconcile-releases-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: 🔍 Reconcile Releases
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            ghcr.io:443

      - name: Checkout
        # yamllint disable-line rule:line-length
        uses: lgtm-hq/lgtm-ci/.github/actions/secure-checkout@8f0fd9339df5d30a529aa572ceb51345b8be33a0 # v0.79.2
        with:
          fetch-depth: 0

      - name: Reconcile tags against releases and images
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ghcr.io/lgtm-hq/rustume
          MAX_TAGS: "50"
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/release/reconcile-releases.sh
