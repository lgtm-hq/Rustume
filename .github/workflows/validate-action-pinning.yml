# SPDX-License-Identifier: AGPL-3.0-only
---
name: Quality Check - Action Pinning Validation
# Validates that external GitHub Actions are pinned to SHA commits.

"on":
  pull_request:
  merge_group:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # yamllint disable-line rule:line-length
    uses: lgtm-hq/lgtm-ci/.github/workflows/reusable-validate-action-pinning.yml@b830ca6972f0c9cbaeb1363283de594f68d66acf # v0.87.0
    with:
      job-name: "📌 Validate Action Pinning"
      tooling-ref: "b830ca6972f0c9cbaeb1363283de594f68d66acf" # v0.87.0
      egress-policy: block
      egress-preset: github-tooling
      fail-on-error: true
    permissions:
      contents: read
