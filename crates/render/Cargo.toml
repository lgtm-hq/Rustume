[lints]
workspace = true

[package]
name = "rustume-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Template engine and PDF generation for Rustume"

[dependencies]
rustume-schema = { path = "../schema" }
rustume-utils = { path = "../utils" }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Typst ecosystem
typst.workspace = true
typst-layout.workspace = true
typst-pdf.workspace = true
typst-render.workspace = true
typst-assets.workspace = true

# Date/time for Typst World
chrono.workspace = true

# Decode data-URL profile pictures into Typst binary assets
base64 = { version = "0.23", default-features = false, features = ["std"] }

# Embedded template directory
include_dir.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

[dev-dependencies]
# PDF text extraction for content-level render assertions (lopdf's stricter
# CMap parser rejects Typst's ToUnicode streams; pdf-extract handles them)
pdf-extract = "=0.12.0"
# PNG decode for per-template visual baseline comparison (#831)
image = { version = "0.25", default-features = false, features = ["png"] }
rstest.workspace = true
rustume-parser = { path = "../parser" }
tempfile = "=3.27.0"
criterion = { version = "0.5", default-features = false, features = [
  "cargo_bench_support",
] }

[[bench]]
name = "render_path"
harness = false
